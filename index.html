<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퍼리 내전방: 이터널 리턴 랭크 티어와 주챔</title>
<meta name="description" content="내전방 멤버들의 이터널 리턴 최고 티어, 현재 티어, 많이 하는 실험체를 3시간마다 갱신해서 보여 줍니다.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f3f1ec;
    --ink: #1c1a17;
    --ink-2: #46423c;
    --muted: #6c675f;
    --faint: #a9a49b;
    --line: #dcd8d0;
    --line-2: #c9c4ba;
    --hover: #ebe8e1;
    /* 티어 색 (채도 낮게) */
    --t-iron: #8b8884;
    --t-bronze: #a07d64;
    --t-silver: #9ea6ae;
    --t-gold: #b9a26c;
    --t-platinum: #88a88a;
    --t-diamond: #7a94b6;
    --t-meteorite: #9286ae;
    --t-mithril: #6fa5ab;
    --t-demigod: #c0915f;
    --t-eternity: #b06d74;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131211;
      --ink: #ece9e3;
      --ink-2: #c8c4bd;
      --muted: #9a958d;
      --faint: #5c5852;
      --line: #2a2826;
      --line-2: #3a3734;
      --hover: #1c1b19;
      --t-iron: #9a9792;
      --t-bronze: #b38f76;
      --t-silver: #aeb6bd;
      --t-gold: #c9b47f;
      --t-platinum: #98b89a;
      --t-diamond: #8ea7c6;
      --t-meteorite: #a598bf;
      --t-mithril: #82b6bb;
      --t-demigod: #cfa271;
      --t-eternity: #c48088;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    word-break: keep-all;
  }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }

  .notice { font-size: 14px; color: var(--ink-2); padding: 12px 0; border-bottom: 1px solid var(--line); }

  /* 머리 */
  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 32px;
    padding: 64px 0 32px; border-bottom: 1px solid var(--ink);
  }
  h1 {
    font-size: clamp(36px, 5.2vw, 60px); line-height: 1.05; font-weight: 500;
    letter-spacing: -0.04em; margin: 0;
  }
  .stamp { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

  /* 최고/현재 티어 전환 */
  .mode { display: inline-flex; padding: 3px; border: 1px solid var(--line-2); border-radius: 24px; }
  .mode[hidden] { display: none; }
  .mode button {
    font: inherit; font-size: 15px; font-weight: 500; color: var(--ink-2); background: none; cursor: pointer;
    border: 0; height: 40px; padding: 0 18px; border-radius: 20px;
    transition: background-color .15s, color .15s, transform .1s;
  }
  .mode button:hover { color: var(--ink); }
  .mode button:active { transform: scale(.97); }
  .mode button[aria-pressed="true"] { color: var(--bg); background: var(--ink); }

  @media (prefers-reduced-motion: no-preference) {
    .enter { animation: enter .6s cubic-bezier(.2, .7, .2, 1) both; }
    .enter-2 { animation-delay: .08s; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
  }

  /* 요약 */
  .overview { display: grid; grid-template-columns: 1.15fr 1fr; gap: 64px; padding: 48px 0 16px; }
  h2 { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; margin: 0; }
  .h2-note { font-size: 13px; color: var(--muted); margin: 4px 0 20px; }

  .dist { list-style: none; margin: 0; padding: 0; }
  .dist li { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 12px; height: 30px; }
  .dist .tn { font-size: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dist .tn i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--tc); flex: none; }
  .dist .track { height: 10px; position: relative; }
  .dist .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
  .dist .bar { display: block; position: relative; height: 100%; background: var(--tc); transform-origin: left; transition: width .35s cubic-bezier(.2, .7, .2, 1); }
  @media (prefers-reduced-motion: no-preference) {
    .dist.first .bar { animation: grow .7s cubic-bezier(.2, .7, .2, 1) .15s both; }
    @keyframes grow { from { transform: scaleX(0); } }
  }
  .dist .cnt { font-size: 14px; text-align: right; }
  .dist li.zero .tn, .dist li.zero .cnt { color: var(--faint); }
  .dist li.zero .tn i { background: var(--line-2); }

  .picks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  .picks li { display: grid; grid-template-columns: 28px 1fr auto; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .picks .no { font-size: 14px; color: var(--muted); }
  .picks .pn { font-size: 16px; font-weight: 500; }
  .picks .pc { font-size: 14px; color: var(--muted); }

  /* 정렬·검색 */
  .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 24px; margin-top: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
  .search { flex: 1 1 240px; max-width: 340px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line-2); transition: border-color .15s; }
  .search:focus-within { border-color: var(--ink); }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 15px; height: 44px; outline: none; }
  .search input::placeholder { color: var(--faint); }
  .sorts { display: flex; flex-wrap: wrap; gap: 4px; }
  .sorts button {
    font: inherit; font-size: 14px; color: var(--ink-2); background: none; cursor: pointer;
    border: 1px solid var(--line-2); height: 36px; padding: 0 14px; border-radius: 18px;
    transition: background-color .15s, color .15s, border-color .15s, transform .1s;
  }
  .sorts button:hover { border-color: var(--ink); color: var(--ink); }
  .sorts button:active { transform: scale(.97); }
  .sorts button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

  /* 표 */
  .row {
    display: grid;
    grid-template-columns: 32px minmax(120px, 1.05fr) minmax(150px, 1fr) 96px 112px minmax(150px, .95fr) minmax(220px, 1.4fr);
    align-items: center; gap: 16px; padding: 16px 8px; border-bottom: 1px solid var(--line);
    transition: background-color .15s;
  }
  .row:not(.head):hover { background: var(--hover); }
  .row.head { padding-top: 12px; padding-bottom: 12px; }
  .row.head > div { font-size: 13px; font-weight: 500; color: var(--muted); }
  .num-r { text-align: right; }
  .sub { font-size: 13px; color: var(--muted); }

  .c-rank { font-size: 15px; color: var(--muted); }
  .row.top .c-rank { color: var(--ink); font-weight: 600; }
  .nick { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; word-break: break-all; }
  .memo { font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }

  .c-tier { display: flex; align-items: center; gap: 12px; }
  .emblem { position: relative; width: 26px; height: 26px; flex: none; }
  .emblem::before {
    content: ""; position: absolute; inset: 5px; transform: rotate(45deg);
    border: 1.5px solid color-mix(in srgb, var(--tc) 65%, var(--ink)); background: var(--tc);
  }
  .emblem.crown::after { content: ""; position: absolute; inset: 0; transform: rotate(45deg); border: 1px solid var(--tc); }
  .tier-name { font-size: 15px; font-weight: 500; white-space: nowrap; }

  .rp { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; text-align: right; }
  .prog { height: 3px; background: var(--line); margin-top: 8px; }
  .prog i { display: block; height: 100%; background: var(--tc, var(--ink)); }
  .rec { font-size: 15px; }

  .mains { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 14px; color: var(--muted); line-height: 1.6; }
  .mains span { white-space: nowrap; }
  .mains b { font-weight: 500; color: var(--ink); }
  .mains .first b { font-weight: 600; }
  .mains em { font-style: normal; margin-left: 4px; }

  .row.off .nick { color: var(--ink-2); }
  .row.off .reason { grid-column: 3 / -1; font-size: 14px; color: var(--muted); }

  .group-label { font-size: 14px; font-weight: 500; color: var(--muted); padding: 40px 8px 12px; border-bottom: 1px solid var(--ink); }
  .empty { padding: 64px 0; text-align: center; color: var(--ink-2); }
  .empty h2 { margin-bottom: 8px; }
  .empty code { font-size: 14px; background: var(--hover); padding: 2px 6px; border-radius: 4px; }

  footer { margin: 64px 0 0; padding: 20px 0 40px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 32px; }

  /* 태블릿·모바일 */
  @media (max-width: 960px) {
    .overview { grid-template-columns: 1fr; gap: 48px; }
    .row.head { display: none; }
    .row {
      grid-template-columns: 28px 1fr auto;
      grid-template-areas:
        "rank player rp"
        ".    tier   pos"
        ".    rec    rec"
        ".    mains  mains";
      gap: 10px 12px; padding: 20px 4px;
    }
    .c-rank { grid-area: rank; align-self: start; padding-top: 1px; }
    .c-player { grid-area: player; }
    .c-tier { grid-area: tier; }
    .c-rp { grid-area: rp; min-width: 88px; }
    .c-pos { grid-area: pos; text-align: right; }
    .c-rec { grid-area: rec; }
    .c-mains { grid-area: mains; }
    .row.off { grid-template-areas: "rank player player" ".    reason reason"; }
    .row.off .reason { grid-area: reason; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 20px; }
    header { padding: 40px 0 24px; }
    .mode { width: 100%; }
    .mode button { flex: 1; height: 44px; border-radius: 22px; }
    .sorts { width: 100%; }
    .sorts button { flex: 1 0 auto; padding: 0 10px; height: 44px; border-radius: 22px; }
    .dist li { grid-template-columns: 84px 1fr 36px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice"></div>
  <header>
    <div>
      <h1 id="title" class="enter"></h1>
      <p class="stamp enter enter-2" id="stamp"></p>
    </div>
    <div class="mode enter enter-2" id="mode" role="group" aria-label="티어 기준" hidden>
      <button type="button" data-mode="peak" aria-pressed="true">최고 티어</button>
      <button type="button" data-mode="current" aria-pressed="false">현재 티어</button>
    </div>
  </header>
  <main id="app"><div class="empty">불러오는 중</div></main>
  <footer>
    <span>데이터: 이터널 리턴 Open API, 3시간마다 갱신</span>
    <span>최고 티어는 이번 시즌 최고 RP, 시즌 11부터의 시즌 최종 RP, 그 전 시즌 기록 중 가장 높은 값이에요.</span>
  </footer>
</div>

<script>
  // ── 여기만 바꾸면 사이트 제목이 바뀌어요 ──
  const SITE_TITLE = "퍼리 내전방";

  const TIERS = [
    ["iron", "아이언"], ["bronze", "브론즈"], ["silver", "실버"], ["gold", "골드"],
    ["platinum", "플래티넘"], ["diamond", "다이아몬드"], ["meteorite", "메테오라이트"],
    ["mithril", "미스릴"], ["demigod", "데미갓"], ["eternity", "이터니티"],
  ];
  const TIER_IDX = Object.fromEntries(TIERS.map(([k], i) => [k, i]));
  const tierColor = (tier) => `var(--t-${TIER_IDX[tier] != null ? tier : "iron"})`;

  const params = new URLSearchParams(location.search);
  const SAMPLE = params.has("sample");
  const DATA_URL = SAMPLE ? "data/sample.json" : "data/players.json";

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (n, d = 0) => (n == null || Number.isNaN(n) ? "–" : Number(n).toLocaleString("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: d }));
  const pad = (n) => String(n).padStart(2, "0");

  document.title = `${SITE_TITLE}: 이터널 리턴 랭크 티어와 주챔`;
  $("#title").textContent = SITE_TITLE;

  function ago(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1) return "방금";
    if (mins < 60) return `${mins}분 전`;
    const h = Math.round(mins / 60);
    return h < 24 ? `${h}시간 전` : `${Math.round(h / 24)}일 전`;
  }
  function stamp(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  const state = { mode: "peak", sort: "tier", q: "" };
  let DATA = null;
  let firstPaint = true;

  // 지금 보는 기준(최고/현재)의 티어. 없으면 null.
  function view(p) {
    if (state.mode === "peak") {
      const k = p.peak;
      if (!k) return null;
      const note = k.source === "manual"
        ? `${k.season ? k.season + " · " : ""}직접 입력 · RP는 티어 최저치`
        : (k.source === "current" ? "이번 시즌 기록" : `${k.season} 기록`);
      return { tier: k.tier, tierName: k.tierName, division: k.division, rp: k.rp, note, progress: null };
    }
    if (p.status !== "ok") return null;
    const crown = p.tier === "demigod" || p.tier === "eternity";
    const progress = p.nextAt && p.divStart != null
      ? Math.max(0, Math.min(1, (p.rp - p.divStart) / (p.nextAt - p.divStart))) : (crown ? 1 : null);
    const note = p.nextAt ? `다음 단계까지 ${num(p.nextAt - p.rp)} RP` : (crown ? "서버 순위로 정해지는 티어" : "1000위 안에 들면 데미갓");
    return { tier: p.tier, tierName: p.tierName, division: p.division, rp: p.rp, note, progress };
  }
  const byTier = (a, b) => {
    const va = view(a), vb = view(b);
    return (TIER_IDX[vb.tier] - TIER_IDX[va.tier]) || (vb.rp - va.rp);
  };
  const cur = (p, k, fallback) => (p.status === "ok" && p[k] != null ? p[k] : fallback);

  const SORTS = {
    tier: { label: "티어", fn: byTier },
    games: { label: "판수", fn: (a, b) => cur(b, "games", -1) - cur(a, "games", -1) },
    winRate: { label: "승률", fn: (a, b) => cur(b, "winRate", -1) - cur(a, "winRate", -1) },
    avgRank: { label: "평균 순위", fn: (a, b) => cur(a, "avgRank", 99) - cur(b, "avgRank", 99) },
    name: { label: "이름", fn: (a, b) => a.nickname.localeCompare(b.nickname, "ko") },
  };

  async function load() {
    if (SAMPLE) $("#notice").innerHTML = `<div class="notice">예시 데이터로 채운 화면이에요. <a href="./">실제 데이터 보기</a></div>`;
    if (location.protocol === "file:") return showEmpty("file");
    try {
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      DATA = await res.json();
      const m = $("#mode");
      m.hidden = false;
      m.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        if (state.mode === b.dataset.mode) return;
        state.mode = b.dataset.mode;
        m.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
        render();
      }));
      render();
    } catch (e) {
      showEmpty(String(e.message) === "404" ? "nodata" : "error", e);
    }
  }

  function showEmpty(kind, err) {
    const msg = {
      file: `<h2>파일을 바로 열면 데이터를 못 불러와요</h2>
             <p>이 폴더에서 <code>python -m http.server</code>를 실행하고 <a href="http://localhost:8000/">localhost:8000</a>으로 열어 주세요.</p>`,
      nodata: `<h2>아직 데이터가 없어요</h2>
               <p>첫 자동 갱신이 끝나면 여기에 표가 생겨요. <a href="?sample">예시 데이터로 미리 보기</a></p>`,
      error: `<h2>데이터를 불러오지 못했어요</h2><p>${esc(err)}</p>`,
    }[kind];
    $("#app").innerHTML = `<div class="empty">${msg}</div>`;
  }

  function popular(ok) {
    const map = new Map();
    ok.forEach((p) => (p.mains || []).forEach((m) => {
      const e = map.get(m.code) || { name: m.name, players: 0, games: 0 };
      e.players += 1; e.games += m.games;
      map.set(m.code, e);
    }));
    return [...map.values()].sort((a, b) => b.players - a.players || b.games - a.games);
  }
  const tierLabel = (v) => `${v.tierName}${v.division ? " " + v.division : ""}`;

  function render() {
    const d = DATA;
    const all = d.players;
    const listed = all.filter((p) => view(p));
    [...listed].sort(byTier).forEach((p, i) => (p.place = i + 1));
    const pop = popular(all.filter((p) => p.status === "ok"));

    const season = d.seasonName ? d.seasonName.replace(/^Season\s*/i, "시즌 ") : null;
    $("#stamp").textContent = [season, `${ago(d.updatedAt)} 갱신 · ${stamp(d.updatedAt)}`].filter(Boolean).join(" · ");

    const distNote = state.mode === "peak" ? `최고 티어 기록이 있는 ${listed.length}명` : `이번 시즌 랭크 기록이 있는 ${listed.length}명`;
    $("#app").innerHTML = `
      <div class="overview">
        <section aria-labelledby="h-dist">
          <h2 id="h-dist">${state.mode === "peak" ? "최고 티어 분포" : "현재 티어 분포"}</h2>
          <p class="h2-note">${distNote}</p>
          ${distHtml(listed)}
        </section>
        <section aria-labelledby="h-picks">
          <h2 id="h-picks">많이 하는 실험체</h2>
          <p class="h2-note">이번 시즌 각자 판수가 많은 실험체 3명을 모아서 센 결과예요</p>
          ${picksHtml(pop)}
        </section>
      </div>
      <section aria-labelledby="h-list">
        <h2 id="h-list" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">전체 순위</h2>
        <div class="controls">
          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="닉네임, 메모, 실험체로 찾기" aria-label="검색" value="${esc(state.q)}" autocomplete="off">
          </label>
          <div class="sorts" role="group" aria-label="정렬 기준">
            ${Object.entries(SORTS).map(([k, s]) => `<button type="button" data-sort="${k}" aria-pressed="${state.sort === k}">${s.label}</button>`).join("")}
          </div>
        </div>
        <div id="rows"></div>
      </section>`;
    firstPaint = false;

    $("#q").addEventListener("input", (e) => { state.q = e.target.value; renderRows(); });
    document.querySelectorAll("[data-sort]").forEach((b) =>
      b.addEventListener("click", () => {
        state.sort = b.dataset.sort;
        document.querySelectorAll("[data-sort]").forEach((x) => x.setAttribute("aria-pressed", x === b));
        renderRows();
      }));
    renderRows();
  }

  function distHtml(listed) {
    const counts = TIERS.map(([k]) => listed.filter((p) => view(p).tier === k).length);
    const max = Math.max(1, ...counts);
    return `<ul class="dist ${firstPaint ? "first" : ""}">${TIERS.map(([k, name], i) => {
      const c = counts[i];
      return `<li class="${c ? "" : "zero"}" style="--tc:${tierColor(k)}">
        <span class="tn"><i></i>${name}</span>
        <span class="track">${c ? `<span class="bar" style="width:${(c / max) * 100}%"></span>` : ""}</span>
        <span class="cnt">${c}명</span>
      </li>`;
    }).reverse().join("")}</ul>`;
  }

  function picksHtml(list) {
    if (!list.length) return `<p class="sub">아직 데이터가 없어요.</p>`;
    return `<ol class="picks">${list.slice(0, 5).map((c, i) =>
      `<li><span class="no">${i + 1}</span><span class="pn">${esc(c.name)}</span><span class="pc">${c.players}명 · ${num(c.games)}판</span></li>`).join("")}</ol>`;
  }

  function matches(p, q) {
    if (!q) return true;
    q = q.trim().toLowerCase();
    return [p.nickname, p.query, p.memo, ...(p.mains || []).map((m) => m.name)].some((s) => s && s.toLowerCase().includes(q));
  }

  function renderRows() {
    const all = DATA.players.filter((p) => matches(p, state.q));
    const on = all.filter((p) => view(p)).sort(SORTS[state.sort].fn);
    const off = all.filter((p) => !view(p));

    let html = `<div class="row head">
      <div>순위</div><div>플레이어</div><div>${state.mode === "peak" ? "최고 티어" : "현재 티어"}</div><div class="num-r">RP</div><div>이번 시즌 랭킹</div><div>이번 시즌 전적</div><div>많이 하는 실험체</div>
    </div>` + on.map(rowHtml).join("");
    if (!on.length) html += `<div class="empty">찾는 사람이 없어요.</div>`;
    if (off.length) html += `<div class="group-label">${state.mode === "peak" ? "티어 기록 없음" : "이번 시즌 기록 없음"} ${off.length}명</div>` + off.map(offRowHtml).join("");
    $("#rows").innerHTML = html;
  }

  function rowHtml(p) {
    const v = view(p);
    const crown = v.tier === "demigod" || v.tier === "eternity";
    const ok = p.status === "ok";
    const pos = !ok ? "–" : p.serverRank ? `서버 ${num(p.serverRank)}위` : (p.rank ? `${num(p.rank)}위` : "–");
    const pct = ok && p.rankPercent != null ? `상위 ${num(p.rankPercent, p.rankPercent < 10 ? 1 : 0)}%` : "";
    const rec1 = ok ? `${num(p.games)}판 · 승률 ${num(p.winRate, 1)}%` : `<span class="sub">이번 시즌 기록 없음</span>`;
    const rec2 = ok ? [p.avgRank != null ? `평균 ${num(p.avgRank, 1)}등` : null, p.top3Rate != null ? `3등 안 ${num(p.top3Rate, 0)}%` : null].filter(Boolean).join(" · ") : "";
    const mains = (p.mains || []).map((m, i) =>
      `<span class="${i ? "" : "first"}" title="${esc(m.name)} ${m.games}판${m.games ? `, 승률 ${num((m.wins / m.games) * 100, 0)}%` : ""}"><b>${esc(m.name)}</b><em>${m.games}판</em></span>`).join("");
    const staleTag = p.stale ? `<span class="tag" title="${esc(p.error || "")}">지난 데이터</span>` : "";

    return `<div class="row ${p.place <= 3 ? "top" : ""}" style="--tc:${tierColor(v.tier)}">
      <div class="c-rank">${p.place}</div>
      <div class="c-player"><div class="nick">${esc(p.nickname)}${staleTag}</div>${p.memo ? `<div class="memo">${esc(p.memo)}</div>` : ""}</div>
      <div class="c-tier">
        <span class="emblem ${crown ? "crown" : ""}" aria-hidden="true"></span>
        <div><div class="tier-name">${esc(tierLabel(v))}</div><div class="sub">${esc(v.note)}</div></div>
      </div>
      <div class="c-rp"><div class="rp">${num(v.rp)}<span class="sub"> RP</span></div>${v.progress != null ? `<div class="prog"><i style="width:${v.progress * 100}%"></i></div>` : ""}</div>
      <div class="c-pos"><div class="rec">${pos}</div><div class="sub">${pct}</div></div>
      <div class="c-rec"><div class="rec">${rec1}</div><div class="sub">${rec2}</div></div>
      <div class="c-mains"><div class="mains">${mains || "–"}</div></div>
    </div>`;
  }

  function offRowHtml(p) {
    const reason = {
      not_found: "닉네임을 찾을 수 없어요. 닉네임을 바꿨다면 players.txt를 고쳐 주세요.",
      unranked: state.mode === "peak" ? "확인한 시즌에 랭크 기록이 없어요." : "이번 시즌 랭크 기록이 없어요.",
      error: `조회하지 못했어요: ${p.error || "알 수 없는 오류"}`,
    }[p.status] || (state.mode === "peak" ? "티어 기록이 없어요." : "이번 시즌 랭크 기록이 없어요.");
    return `<div class="row off">
      <div class="c-rank">–</div>
      <div class="c-player"><div class="nick">${esc(p.nickname)}</div>${p.memo ? `<div class="memo">${esc(p.memo)}</div>` : ""}</div>
      <div class="reason">${esc(reason)}</div>
    </div>`;
  }

  load();
</script>
</body>
</html>
