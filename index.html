<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랭크 보드 · 이터널 리턴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f5f4f1;
    --paper: #fbfaf8;
    --ink: #121212;
    --ink-2: #3b3b3b;
    --muted: #7c7c7c;
    --faint: #b8b6b1;
    --line: #dddbd6;
    --hover: #eeede9;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    /* 티어 색 (채도 낮게) */
    --t-iron: #8b8884;
    --t-bronze: #a07d64;
    --t-silver: #9ea6ae;
    --t-gold: #b9a26c;
    --t-platinum: #88a88a;
    --t-diamond: #7a94b6;
    --t-meteorite: #9286ae;
    --t-mithril: #6fa5ab;
    --t-demigod: #c0915f;
    --t-eternity: #b06d74;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --paper: #121212;
      --ink: #ededed;
      --ink-2: #c9c9c9;
      --muted: #8c8c8c;
      --faint: #4f4f4f;
      --line: #262626;
      --hover: #1a1a1a;
      --t-iron: #9a9792;
      --t-bronze: #b38f76;
      --t-silver: #aeb6bd;
      --t-gold: #c9b47f;
      --t-platinum: #98b89a;
      --t-diamond: #8ea7c6;
      --t-meteorite: #a598bf;
      --t-mithril: #82b6bb;
      --t-demigod: #cfa271;
      --t-eternity: #c48088;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 48px 24px 72px; }

  .notice { font-size: 13px; border: 1px solid var(--ink); padding: 8px 12px; margin-bottom: 28px; }
  .notice a { color: var(--ink); }

  /* 헤더 */
  header { border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
  .kicker { font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.05; font-weight: 800; letter-spacing: -0.035em; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 14px; font-size: 13.5px; color: var(--ink-2); }
  .meta span::before { content: "—"; color: var(--faint); margin-right: 8px; }
  .meta span:first-child::before { content: none; }

  /* 요약 */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .tile { padding: 20px 20px 20px 0; }
  .tile + .tile { border-left: 1px solid var(--line); padding-left: 20px; }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.15; word-break: keep-all; overflow-wrap: anywhere; }
  .sub { font-size: 12.5px; color: var(--muted); }

  .overview { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; padding: 28px 0 8px; }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .section-title h2 { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }

  .hist { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; align-items: end; height: 150px; }
  .hcol { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; height: 100%; }
  .hcol b { font-size: 12px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .hcol b.zero { color: var(--faint); font-weight: 400; }
  .hbar { border: 1px solid color-mix(in srgb, var(--tc) 72%, var(--ink)); background: var(--tc); min-height: 1px; }
  .hbar.zero { border-color: var(--line); border-width: 1px 0 0; }
  .hlabels { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 8px; border-top: 1px solid var(--ink); padding-top: 6px; }
  .hlabels span { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hlabels b { font-weight: 400; }
  .hlabels .short { display: none; }

  .popular { list-style: none; margin: 0; padding: 0; counter-reset: pop; }
  .popular li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); counter-increment: pop; }
  .popular li:first-child { border-top: 1px solid var(--ink); }
  .popular li::before { content: counter(pop, decimal-leading-zero); font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .popular .pname { font-weight: 600; }
  .popular .pcount { font-size: 12.5px; color: var(--muted); }

  /* 컨트롤 */
  .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px 24px; margin: 40px 0 0; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
  .search { flex: 1 1 220px; max-width: 320px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--ink-2); }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; border: 0; background: none; color: var(--ink); font: inherit; padding: 6px 0; outline: none; }
  .search input::placeholder { color: var(--faint); }
  .sorts { display: flex; flex-wrap: wrap; gap: 4px; }
  .sorts button {
    font: inherit; font-size: 13px; color: var(--muted); background: none; cursor: pointer;
    border: 1px solid transparent; padding: 5px 11px; border-radius: 999px;
  }
  .sorts button:hover { color: var(--ink); }
  .sorts button[aria-pressed="true"] { color: var(--bg); background: var(--ink); }
  .sorts button:focus-visible, .search input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* 표 */
  .row {
    display: grid;
    grid-template-columns: 36px minmax(120px, 1fr) minmax(140px, .95fr) 96px 104px minmax(140px, .95fr) minmax(250px, 1.7fr);
    align-items: center; gap: 16px; padding: 14px 8px; border-bottom: 1px solid var(--line);
  }
  .row:not(.head):hover { background: var(--hover); }
  .row.head { padding-top: 10px; padding-bottom: 10px; }
  .row.head > div { font-size: 12px; color: var(--muted); }
  .num-r { text-align: right; }

  .c-rank { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .row.top .c-rank { color: var(--ink); font-weight: 700; }
  .nick { font-weight: 700; font-size: 15.5px; letter-spacing: -0.01em; word-break: break-all; }
  .memo { font-size: 12.5px; color: var(--muted); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; border: 1px solid var(--muted); color: var(--muted); padding: 0 5px; margin-left: 6px; vertical-align: 2px; }

  .c-tier { display: flex; align-items: center; gap: 12px; }
  .emblem { position: relative; width: 26px; height: 26px; flex: none; }
  .emblem::before {
    content: ""; position: absolute; inset: 5px; transform: rotate(45deg);
    border: 1.5px solid color-mix(in srgb, var(--tc) 65%, var(--ink)); background: var(--tc);
  }
  .emblem.crown::after { content: ""; position: absolute; inset: 0; transform: rotate(45deg); border: 1px solid var(--tc); }
  .tier-name { font-weight: 600; white-space: nowrap; }
  .tier-name .div { font-family: var(--mono); font-weight: 500; margin-left: 2px; }

  .rp { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-align: right; }
  .prog { height: 3px; background: var(--line); margin-top: 6px; }
  .prog i { display: block; height: 100%; background: var(--tc, var(--ink)); }

  .mains { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 2px; font-size: 13px; white-space: nowrap; background: var(--paper); }
  .chip:first-child { border-color: var(--ink-2); }
  .av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--ink); color: var(--bg); }
  .chip + .chip .av { background: var(--faint); color: var(--paper); }
  .chip .n { color: var(--muted); font-size: 12px; }

  .row.off { color: var(--muted); }
  .row.off .nick { color: var(--ink-2); }
  .row.off .reason { grid-column: 3 / -1; font-size: 13px; }

  .group-label { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 32px 8px 10px; border-bottom: 1px solid var(--ink); }
  .empty { padding: 56px 0; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 20px; margin: 0 0 8px; }
  .empty a, footer a { color: var(--ink); }
  .empty code { font-family: var(--mono); font-size: 13px; background: var(--hover); padding: 2px 6px; }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

  /* 모바일: 표 → 카드 */
  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .tile:nth-child(3) { border-left: 0; padding-left: 0; }
    .tile:nth-child(n+3) { border-top: 1px solid var(--line); }
    .overview { grid-template-columns: 1fr; gap: 32px; }
    .row.head { display: none; }
    .row {
      grid-template-columns: 32px 1fr auto;
      grid-template-areas:
        "rank player rp"
        ".    tier   pos"
        ".    rec    rec"
        ".    mains  mains";
      gap: 8px 12px; padding: 16px 4px;
    }
    .c-rank { grid-area: rank; align-self: start; padding-top: 3px; }
    .c-player { grid-area: player; }
    .c-tier { grid-area: tier; }
    .c-rp { grid-area: rp; min-width: 88px; }
    .c-pos { grid-area: pos; }
    .c-rec { grid-area: rec; }
    .c-mains { grid-area: mains; }
    .row.off { grid-template-areas: "rank player player" ".    reason reason"; }
    .row.off .reason { grid-area: reason; }
  }
  @media (max-width: 480px) {
    .wrap { padding: 32px 16px 56px; }
    .value { font-size: 21px; }
    .hlabels span { font-size: 10px; }
    .hlabels .full { display: none; }
    .hlabels .short { display: inline; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice"></div>
  <header>
    <p class="kicker">Eternal Return · Ranked Squad</p>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="app"><div class="empty">불러오는 중…</div></div>
  <footer>
    <span>데이터: 이터널 리턴 Open API · 몇 시간마다 자동 갱신</span>
    <span>티어는 RP와 순위로 계산한 값이라 게임 내 표시와 조금 다를 수 있어요.</span>
  </footer>
</div>

<script>
  // ── 여기만 바꾸면 사이트 제목이 바뀌어요 ──
  const SITE_TITLE = "우리끼리 랭크";

  const TIERS = [
    ["iron", "아이언"], ["bronze", "브론즈"], ["silver", "실버"], ["gold", "골드"],
    ["platinum", "플래티넘"], ["diamond", "다이아몬드"], ["meteorite", "메테오라이트"],
    ["mithril", "미스릴"], ["demigod", "데미갓"], ["eternity", "이터니티"],
  ];
  const TIER_IDX = Object.fromEntries(TIERS.map(([k], i) => [k, i]));
  const tierColor = (tier) => `var(--t-${TIER_IDX[tier] != null ? tier : "iron"})`;

  const params = new URLSearchParams(location.search);
  const SAMPLE = params.has("sample");
  const DATA_URL = SAMPLE ? "data/sample.json" : "data/players.json";

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (n, d = 0) => (n == null || Number.isNaN(n) ? "–" : Number(n).toLocaleString("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: d }));
  const pad = (n) => String(n).padStart(2, "0");

  document.title = `${SITE_TITLE} · 이터널 리턴`;
  $("#title").textContent = SITE_TITLE;

  function ago(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1) return "방금 전";
    if (mins < 60) return `${mins}분 전`;
    const h = Math.round(mins / 60);
    return h < 24 ? `${h}시간 전` : `${Math.round(h / 24)}일 전`;
  }
  function stamp(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  const SORTS = {
    tier: { label: "티어", fn: (a, b) => (TIER_IDX[b.tier] - TIER_IDX[a.tier]) || (b.rp - a.rp) },
    games: { label: "판수", fn: (a, b) => b.games - a.games },
    winRate: { label: "승률", fn: (a, b) => (b.winRate ?? -1) - (a.winRate ?? -1) },
    avgRank: { label: "평균 순위", fn: (a, b) => (a.avgRank ?? 99) - (b.avgRank ?? 99) },
    name: { label: "이름", fn: (a, b) => a.nickname.localeCompare(b.nickname, "ko") },
  };
  const state = { sort: "tier", q: "" };
  let DATA = null;

  async function load() {
    if (SAMPLE) $("#notice").innerHTML = `<div class="notice">예시 데이터로 보는 화면이에요. 실제 데이터는 <a href="./">여기</a>.</div>`;
    if (location.protocol === "file:") return showEmpty("file");
    try {
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      DATA = await res.json();
      prepare(DATA);
      render();
    } catch (e) {
      showEmpty(String(e.message) === "404" ? "nodata" : "error", e);
    }
  }

  function prepare(data) {
    const ok = data.players.filter((p) => p.status === "ok");
    [...ok].sort(SORTS.tier.fn).forEach((p, i) => (p.place = i + 1));
  }

  function showEmpty(kind, err) {
    const msg = {
      file: `<h2>파일을 바로 열면 데이터를 못 불러와요</h2>
             <p>이 폴더에서 <code>python -m http.server</code> 를 실행하고<br><a href="http://localhost:8000/">http://localhost:8000</a> 으로 열어 주세요.</p>`,
      nodata: `<h2>아직 데이터가 없어요</h2>
               <p>GitHub Actions의 첫 갱신이 끝나면 여기에 표시돼요.<br><a href="?sample">예시 화면 먼저 보기 →</a></p>`,
      error: `<h2>데이터를 불러오지 못했어요</h2><p>${esc(err)}</p>`,
    }[kind];
    $("#app").innerHTML = `<div class="empty">${msg}</div>`;
  }

  function render() {
    const d = DATA;
    const all = d.players;
    const ok = all.filter((p) => p.status === "ok");

    const meta = [];
    if (d.seasonName || d.seasonId) meta.push(esc(d.seasonName || `시즌 ID ${d.seasonId}`));
    meta.push(`${all.length}명`);
    meta.push(`${esc(ago(d.updatedAt))} 갱신 (${esc(stamp(d.updatedAt))})`);
    $("#meta").innerHTML = meta.map((m) => `<span>${m}</span>`).join("");

    $("#app").innerHTML = `
      ${tilesHtml(ok, all)}
      <div class="overview">
        <section>
          <div class="section-title"><h2>티어 분포</h2><span class="sub">랭크 기록 ${ok.length}명</span></div>
          ${histHtml(ok)}
        </section>
        <section>
          <div class="section-title"><h2>우리 그룹 인기 주챔</h2><span class="sub">주챔 3명 기준</span></div>
          ${popularHtml(ok)}
        </section>
      </div>
      <div class="controls">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="닉네임·메모·실험체 검색" value="${esc(state.q)}" autocomplete="off">
        </label>
        <div class="sorts" role="group" aria-label="정렬">
          ${Object.entries(SORTS).map(([k, s]) => `<button type="button" data-sort="${k}" aria-pressed="${state.sort === k}">${s.label}</button>`).join("")}
        </div>
      </div>
      <div id="rows"></div>`;

    $("#q").addEventListener("input", (e) => { state.q = e.target.value; renderRows(); });
    document.querySelectorAll("[data-sort]").forEach((b) =>
      b.addEventListener("click", () => {
        state.sort = b.dataset.sort;
        document.querySelectorAll("[data-sort]").forEach((x) => x.setAttribute("aria-pressed", x === b));
        renderRows();
      }));
    renderRows();
  }

  function tilesHtml(ok, all) {
    const best = [...ok].sort(SORTS.tier.fn)[0];
    const avg = ok.length ? ok.reduce((s, p) => s + p.rp, 0) / ok.length : null;
    const games = ok.reduce((s, p) => s + p.games, 0);
    const pop = popular(ok)[0];
    const tile = (label, value, sub) => `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
    return `<div class="tiles">
      ${tile("Ranked", `${ok.length}<span class="sub"> / ${all.length}명</span>`, "이번 시즌 랭크 기록")}
      ${tile("Avg RP", num(avg), `모두 합쳐 ${num(games)}판`)}
      ${tile("No.1", best ? esc(best.nickname) : "–", best ? `${tierLabel(best)} · ${num(best.rp)} RP` : "")}
      ${tile("Most Picked", pop ? esc(pop.name) : "–", pop ? `${pop.players}명의 주챔 · ${num(pop.games)}판` : "")}
    </div>`;
  }

  function histHtml(ok) {
    const counts = TIERS.map(([k]) => ok.filter((p) => p.tier === k).length);
    const max = Math.max(1, ...counts);
    const cols = TIERS.map(([k], i) => {
      const c = counts[i];
      return `<div class="hcol" title="${TIERS[i][1]} ${c}명">
        <b class="${c ? "" : "zero"}">${c}</b>
        <div class="hbar ${c ? "" : "zero"}" style="height:${c ? (c / max) * 100 : 0}%;--tc:${tierColor(k)}"></div>
      </div>`;
    }).join("");
    const SHORT = { platinum: "플래", diamond: "다이아", meteorite: "메테오", eternity: "이터" };
    const labels = TIERS.map(([k, name]) =>
      `<span title="${name}"><b class="full">${name.length > 4 ? name.slice(0, 3) : name}</b><b class="short">${SHORT[k] || name}</b></span>`).join("");
    return `<div class="hist">${cols}</div><div class="hlabels">${labels}</div>`;
  }

  function popular(ok) {
    const map = new Map();
    ok.forEach((p) => (p.mains || []).forEach((m) => {
      const e = map.get(m.code) || { name: m.name, players: 0, games: 0 };
      e.players += 1; e.games += m.games;
      map.set(m.code, e);
    }));
    return [...map.values()].sort((a, b) => b.players - a.players || b.games - a.games);
  }
  function popularHtml(ok) {
    const list = popular(ok).slice(0, 5);
    if (!list.length) return `<p class="sub">아직 데이터가 없어요.</p>`;
    return `<ol class="popular">${list.map((c) =>
      `<li><span class="pname">${esc(c.name)}</span><span class="pcount">${c.players}명 · ${num(c.games)}판</span></li>`).join("")}</ol>`;
  }

  const tierLabel = (p) => `${p.tierName}${p.division ? " " + p.division : ""}`;

  function matches(p, q) {
    if (!q) return true;
    q = q.trim().toLowerCase();
    return [p.nickname, p.query, p.memo, ...(p.mains || []).map((m) => m.name)].some((s) => s && s.toLowerCase().includes(q));
  }

  function renderRows() {
    const all = DATA.players.filter((p) => matches(p, state.q));
    const ok = all.filter((p) => p.status === "ok").sort(SORTS[state.sort].fn);
    const off = all.filter((p) => p.status !== "ok");

    const head = `<div class="row head">
      <div>#</div><div>플레이어</div><div>티어</div><div class="num-r">RP</div><div>순위</div><div>전적</div><div>주챔</div>
    </div>`;
    let html = head + ok.map(rowHtml).join("");
    if (!ok.length) html += `<div class="empty">검색 결과가 없어요.</div>`;
    if (off.length) {
      html += `<div class="group-label">기록 없음 · ${off.length}명</div>` + off.map(offRowHtml).join("");
    }
    $("#rows").innerHTML = html;
  }

  function rowHtml(p) {
    const crown = p.tier === "demigod" || p.tier === "eternity";
    const progress = p.nextAt && p.divStart != null
      ? Math.max(0, Math.min(1, (p.rp - p.divStart) / (p.nextAt - p.divStart))) : (crown ? 1 : null);
    const toNext = p.nextAt ? `다음 단계까지 ${num(p.nextAt - p.rp)}` : (crown ? "순위 기준 티어" : "순위 300·1000위 안에 들면 승급");
    const pos = p.serverRank ? `서버 #${num(p.serverRank)}` : (p.rank ? `#${num(p.rank)}` : "–");
    const pct = p.rankPercent != null ? `상위 ${num(p.rankPercent, p.rankPercent < 10 ? 1 : 0)}%` : "";
    const rec2 = [p.avgRank != null ? `평균 ${num(p.avgRank, 1)}위` : null, p.top3Rate != null ? `TOP3 ${num(p.top3Rate, 0)}%` : null].filter(Boolean).join(" · ");
    const mains = (p.mains || []).map((m) => {
      const wr = m.games ? ` · 승률 ${num((m.wins / m.games) * 100, 0)}%` : "";
      return `<span class="chip" title="${esc(m.name)} ${m.games}판${wr}"><span class="av">${esc([...m.name][0] || "?")}</span>${esc(m.name)}<span class="n">${m.games}</span></span>`;
    }).join("");
    const staleTag = p.stale ? `<span class="tag" title="${esc(p.error || "")}">지난 데이터</span>` : "";

    return `<div class="row ${p.place <= 3 ? "top" : ""}" style="--tc:${tierColor(p.tier)}">
      <div class="c-rank">${pad(p.place)}</div>
      <div class="c-player"><div class="nick">${esc(p.nickname)}${staleTag}</div>${p.memo ? `<div class="memo">${esc(p.memo)}</div>` : ""}</div>
      <div class="c-tier">
        <span class="emblem ${crown ? "crown" : ""}" aria-hidden="true"></span>
        <div><div class="tier-name">${esc(p.tierName)}${p.division ? `<span class="div">${p.division}</span>` : ""}</div><div class="sub">${toNext}</div></div>
      </div>
      <div class="c-rp"><div class="rp">${num(p.rp)}</div>${progress != null ? `<div class="prog"><i style="width:${progress * 100}%"></i></div>` : ""}</div>
      <div class="c-pos"><div>${pos}</div><div class="sub">${pct}</div></div>
      <div class="c-rec"><div>${num(p.games)}판 · 승률 ${num(p.winRate, 1)}%</div><div class="sub">${rec2}</div></div>
      <div class="c-mains"><div class="mains">${mains || `<span class="sub">–</span>`}</div></div>
    </div>`;
  }

  function offRowHtml(p) {
    const reason = {
      not_found: "닉네임을 찾을 수 없어요 (닉네임을 바꿨다면 players.txt를 고쳐 주세요)",
      unranked: "이번 시즌 랭크 기록이 없어요",
      error: `조회 실패: ${p.error || "알 수 없는 오류"}`,
    }[p.status] || "기록 없음";
    return `<div class="row off">
      <div class="c-rank">–</div>
      <div class="c-player"><div class="nick">${esc(p.nickname)}</div>${p.memo ? `<div class="memo">${esc(p.memo)}</div>` : ""}</div>
      <div class="reason">${esc(reason)}</div>
    </div>`;
  }

  load();
</script>
</body>
</html>
