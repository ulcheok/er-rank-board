name: 랭크 데이터 갱신

on:
  schedule:
    - cron: "17 */3 * * *" # 3시간마다 (GitHub 사정에 따라 조금 늦게 돌 수 있어요)
  workflow_dispatch: # Actions 탭에서 "Run workflow"로 바로 실행
  push:
    branches: [main]
    paths-ignore:
      - "data/players.json"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API에서 데이터 가져오기
        id: fetch
        continue-on-error: true # 실패해도 기존 데이터로 사이트는 배포
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
          ER_SEASON_ID: ${{ vars.ER_SEASON_ID }}
        run: python scripts/fetch_data.py

      - name: 바뀐 데이터 저장
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "랭크 데이터 갱신 [skip ci]"
            git pull --rebase
            git push
          fi

      - name: 페이지 파일 모으기
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/*.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 데이터 가져오기가 실패했으면 사이트 배포 후에 실행 결과를 빨간색(실패)으로 표시
  report:
    needs: [update, deploy]
    if: always() && needs.update.outputs.fetch == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::데이터를 가져오지 못했어요. 'update' 작업의 'API에서 데이터 가져오기' 로그를 확인해 주세요. (API 키 등록 여부, 호출 제한)"
          exit 1
